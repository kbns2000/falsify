# Render Blueprint — free web service. Set HF_TOKEN in the dashboard (never in git).
services:
  - type: web
    name: falsify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn falsify.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FALSIFY_LLM_PROVIDER
        value: hf
      - key: HF_TOKEN
        sync: false
      - key: FALSIFY_MAX_CONCURRENT
        value: "2"
